<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEXORA</title>
<style>
:root{--bg:#000;--sf:#0e1113;--ln:#232a2e;--tx:#eef3f5;--mu:#8b979e;--li:#c6ff3d;--cy:#22d3ee;--rd:#ff5c6c;--on:#000;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f6f5;--sf:#fff;--ln:#d5dddb;--tx:#0b1112;--mu:#5b6a70;--li:#3f6b00;--cy:#0e7490;--rd:#c0182d;--on:#fff;color-scheme:light}}
:root[data-theme=light]{--bg:#f3f6f5;--sf:#fff;--ln:#d5dddb;--tx:#0b1112;--mu:#5b6a70;--li:#3f6b00;--cy:#0e7490;--rd:#c0182d;--on:#fff;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
#app{flex:1;min-height:0;display:flex;flex-direction:column}main{flex:1;min-height:0;overflow:auto;padding:14px;max-width:760px;width:100%;margin:0 auto}
nav{display:flex;border-top:1px solid var(--ln);background:var(--bg)}nav button{flex:1;padding:10px 4px;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}nav button b{display:block;font-size:18px}nav button.on{color:var(--li)}
@media(min-width:800px){#app{flex-direction:row-reverse}nav{flex-direction:column;width:96px;border:0;border-right:1px solid var(--ln);justify-content:flex-start;padding-top:12px}}
h1{font-size:13px;letter-spacing:.3em;margin:0 0 12px;color:var(--li)}h1 span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--li);box-shadow:0 0 10px var(--li);margin-right:8px}h2{font-size:17px;margin:14px 0 8px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:0 0 10px;display:block;width:100%;text-align:left;color:inherit;font:inherit}button.c{cursor:pointer}.c small,.mu{color:var(--mu)}small{font-size:12px}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;margin:4px 0 8px}input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--cy)}
.b{background:var(--li);color:var(--on);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}.b.g{background:none;color:var(--tx);border:1px solid var(--ln)}.b.r{background:none;color:var(--rd);border:1px solid var(--rd)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:0 0 auto}.row>.f{flex:1}.tag{font-size:11px;border:1px solid var(--cy);color:var(--cy);border-radius:99px;padding:1px 8px;margin-left:4px}.tag.w{border-color:var(--rd);color:var(--rd)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sf);border:1px solid var(--li);font-size:16px;flex:none}
#ml{flex:1;overflow:auto;padding:4px 0}.m{max-width:85%;margin:6px 0;padding:8px 10px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);word-break:break-word}.m.me{margin-left:auto;border-color:var(--li)}.m .re{border-left:2px solid var(--cy);padding-left:6px;color:var(--mu);font-size:12px}
ol{list-style:none;padding:0;margin:8px 0}li{display:flex;gap:10px;align-items:baseline;padding:4px 0;color:var(--mu)}li i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ln);flex:none}li.on{color:var(--tx)}li.on i{background:var(--li);border-color:var(--li);box-shadow:0 0 8px var(--li)}li.nx i{border-color:var(--cy)}
.sk{height:56px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--sf),var(--ln),var(--sf));background-size:200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--sf);border:1px solid var(--cy);border-radius:10px;padding:8px 14px;z-index:9;max-width:90%}
.ban{background:var(--sf);border:1px solid var(--rd);color:var(--rd);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cy);margin-right:6px}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style></head><body><div id="app"><main id="v" tabindex="-1"></main><nav id="n"></nav></div><div id="t" hidden role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch{return null}};
const T=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const gen=()=>{const a=crypto.getRandomValues(new Uint8Array(5)),c='23456789ABCDEFGHJKMNPQRSTUVWXYZ';return'NXR-'+[...a].map(x=>c[x%c.length]).join('')};
const rnd=()=>String(crypto.getRandomValues(new Uint32Array(1))[0]%1e6).padStart(6,'0');
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const ST=['CREATED','ACCEPTED','ARRIVING AT PICKUP','PICKED UP','IN TRANSIT','ARRIVING AT DESTINATION','DELIVERED'];
const GL=['◈','⬡','✦','⌬','◬','⎔','✧','⟁'];
let me=L('nx_me')||{h:gen(),n:'',g:'◈'};L('nx_me',me);
let blk=L('nx_blk')||[],rd=L('nx_rd')||{},seen=L('nx_seen')||0,th=L('nx_th')||'auto';
const S={tab:'chats',rooms:null,orders:null,room:null,msgs:null,reply:null,sel:null,filt:'all',dt:'queue',oid:null,form:null,off:!navigator.onLine,last:0};
let db=null,uid=null,ID=me.h,wr=true,uMsg=null;
const setTh=()=>{const r=document.documentElement;th==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=th};setTh();
function toast(m){const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,3500)}
const av=h=>`<span class="av" style="border-color:hsl(${[...h].reduce((a,c)=>a+c.charCodeAt(0),0)*7%360} 90% 60%)">${esc(h===me.h?me.g:'◇')}</span>`;
const nm=(h,n)=>esc(n||h);
const NAV=[['chats','◈','Chats'],['delivery','⬡','Delivery'],['activity','◬','Activity'],['profile','⌬','Profile']];
function nav(){$('#n').innerHTML=NAV.map(([k,i,l])=>`<button data-a="tab" data-k="${k}" class="${S.tab===k?'on':''}" aria-label="${l}"><b>${i}</b>${l}${k==='activity'&&unread()?` <span class="dot"></span>`:''}</button>`).join('')}
const mineO=()=>(S.orders||[]).filter(o=>o.su===ID||o.cu===ID);
const evs=()=>mineO().flatMap(o=>(o.ev||[]).map(e=>({...e,o}))).filter(e=>e.by!==me.h).sort((a,b)=>b.ts-a.ts);
const unread=()=>evs().filter(e=>e.ts>seen).length;
function banner(){return(db?'':`<div class="ban">Shared storage isn’t available in this view (sign in to claude.ai). Chat and delivery need it — nothing is saved or simulated.</div>`)+(S.off?'<div class="ban">Offline — messages and updates can’t be sent until you reconnect.</div>':'')+(db&&!wr?'<div class="ban">You have read-only access here, so you can’t post or create orders.</div>':'')}
function render(){nav();const v=$('#v');if(S.tab==='chats')return S.room?room():list(v);
 if(S.tab==='delivery')return S.oid?odetail(v):S.form?oform(v):dlv(v);
 if(S.tab==='activity')return act2(v);prof(v)}
function list(v){const rs=S.rooms;v.innerHTML=`<h1><span></span>NEXORA</h1>${banner()}<div class="row"><h2 class="f">Public rooms</h2><button class="b" data-a="nr" ${db&&wr?'':'disabled'}>+ New</button></div>`+(S.form==='room'?`<div class="c"><input id="rn" maxlength="40" placeholder="Room name" aria-label="Room name"><input id="rd" maxlength="120" placeholder="Description (optional)" aria-label="Description"><button class="b" data-a="mkroom">Create room</button> <button class="b g" data-a="nr0">Cancel</button><br><small>Rooms are public to anyone who opens this page. Don’t share secrets here.</small></div>`:'')+
 (rs===null?(db?'<div class="sk"></div><div class="sk"></div>':''):!rs.length?'<div class="c mu">No rooms yet. Create the first one.</div>':rs.map(r=>`<button class="c" data-a="open" data-id="${esc(r.id)}"><b>${esc(r.name)}</b>${r.last>(rd[r.id]||0)&&r.lastBy!==me.h?'<span class="tag">new</span>':''}<br><small>${esc(r.desc||'Public room')} · ${r.last?'active '+T(r.last):'no messages'}</small></button>`).join(''))}
function room(){const r=S.room;$('#v').innerHTML=`<div style="display:flex;flex-direction:column;height:100%"><div class="row"><button class="b g" data-a="back" aria-label="Back">←</button><div class="f"><b>${esc(r.name)}</b><br><small>${esc(r.desc||'Public room')}</small></div></div>${banner()}<div id="ml" aria-live="polite"></div><div id="rp"></div><div class="row"><input id="in" class="f" maxlength="500" placeholder="Message as ${esc(me.n||me.h)}" aria-label="Message" ${wr?'':'disabled'}><button class="b" data-a="send" ${wr?'':'disabled'}>Send</button></div></div>`;
 $('#in').addEventListener('keydown',e=>{if(e.key==='Enter')act.send()});draw()}
function draw(){const ml=$('#ml');if(!ml)return;const near=ml.scrollHeight-ml.scrollTop-ml.clientHeight<80;
 ml.innerHTML=S.msgs===null?'<div class="sk"></div>':!S.msgs.length?'<div class="mu" style="text-align:center;margin-top:30px">No messages yet. Say hello.</div>':S.msgs.filter(m=>!blk.includes(m.by)).map(m=>{const mine=m.by===me.h,o=S.sel===m.id;
 return`<div class="m ${mine?'me':''}" data-a="sel" data-id="${m.id}"><small>${nm(m.by,m.n)} · ${T(m.ts)}</small>${m.re?`<div class="re">${esc(m.re.by)}: ${esc(m.re.text)}</div>`:''}<div>${esc(m.text)}</div>${o?`<div class="row" style="margin-top:6px"><button class="b g" data-a="reply" data-id="${m.id}">Reply</button>${mine?`<button class="b r" data-a="del" data-id="${m.id}">Delete</button>`:`<button class="b r" data-a="block" data-h="${esc(m.by)}">Block</button>`}</div>`:''}</div>`}).join('');
 if(near)ml.scrollTop=ml.scrollHeight;$('#rp').innerHTML=S.reply?`<small>Replying to ${esc(S.reply.by)}: ${esc(S.reply.text.slice(0,50))} <a href="#" data-a="xr">✕</a></small>`:''}
function dlv(v){const o=S.orders,q=(o||[]).filter(x=>x.s===0&&x.su!==ID),m=mineO();const l=S.dt==='queue'?q:m;
 v.innerHTML=`<h1><span></span>NEXORA TRANSIT</h1>${banner()}<div class="c"><small>Tracking: <b>unavailable</b> — no map, geocoding or live-location provider is configured, so no positions or ETAs are shown. Status below comes only from recorded events. No payments are processed.</small></div><div class="row"><button class="b ${S.dt==='queue'?'':'g'}" data-a="dt" data-k="queue">Queue (${q.length})</button><button class="b ${S.dt==='mine'?'':'g'}" data-a="dt" data-k="mine">My orders (${m.length})</button><span class="f"></span><button class="b" data-a="no" ${db&&wr?'':'disabled'}>+ Order</button></div><h2>${S.dt==='queue'?'Open for couriers':'Sent / carrying'}</h2>`+
 (o===null?(db?'<div class="sk"></div>':''):!l.length?'<div class="c mu">Nothing here yet.</div>':l.map(x=>`<button class="c" data-a="od" data-id="${esc(x.id)}"><b>${esc(x.name)}</b>${x.fr?'<span class="tag w">fragile</span>':''}<span class="tag">${x.s<0?'CANCELLED':ST[x.s]}</span>${x.dp?'<span class="tag w">DISPUTED</span>':''}<br><small>${esc(x.from)} → ${esc(x.to)} · ${esc(x.size)} · offered ${esc(x.fee||0)} (not charged)</small></button>`).join(''))}
function oform(v){v.innerHTML=`<h1><span></span>NEW TRANSIT ORDER</h1>${banner()}<div class="c"><label>Parcel name<input id="f1" maxlength="60"></label><label>Category<select id="f2"><option>Documents</option><option>Small goods</option><option>Clothing</option><option>Electronics</option><option>Other</option></select></label><label>Size<select id="f3"><option>Small (fits a bag)</option><option>Medium (box)</option><option>Large</option></select></label><label>Weight (kg)<input id="f4" type="number" min="0" step="0.1"></label><label>Pickup area (coarse)<input id="f5" maxlength="60"></label><label>Drop-off area (coarse)<input id="f6" maxlength="60"></label><label>Instructions (shown only to participants)<textarea id="f7" maxlength="300"></textarea></label><label>Offered fee (informational, not charged)<input id="f8" type="number" min="0"></label><label><input id="f9" type="checkbox" style="width:auto"> Fragile / special handling</label><button class="b" data-a="mko">Create order</button> <button class="b g" data-a="nb">Cancel</button><br><small>Use general areas only; exact addresses should be shared after a courier accepts, outside this page.</small></div>`}
function cur(){return(S.orders||[]).find(o=>o.id===S.oid)}
function odetail(v){const o=cur();if(!o){S.oid=null;return render()}const mine=o.su===ID,cr=o.cu===ID,part=mine||cr;
 const tl=ST.map((n,i)=>{const e=(o.ev||[]).find(x=>x.s===i);return`<li class="${e?'on':i===o.s+1?'nx':''}"><i></i><b>${n}</b><small>${e?T(e.ts):''}</small></li>`}).join('');
 let ac='';if(cr&&o.s>=1&&o.s<6){const nx=o.s+1,code=nx===3||nx===6;ac=`<h2>Courier action</h2>${code?`<input id="cd" inputmode="numeric" maxlength="6" placeholder="${nx===3?'Pickup':'Delivery'} code from ${nx===3?'sender':'recipient'}" aria-label="One-time code">`:''}<button class="b" data-a="step">${['','','Arriving at pickup','Verify pickup','Start transit','Arriving at destination','Verify delivery'][nx]}</button>`}
 if(!part&&o.s===0&&db&&wr)ac=`<button class="b" data-a="acc">Accept this order</button>`;
 v.innerHTML=`<div class="row"><button class="b g" data-a="ob">←</button><b class="f">${esc(o.name)}</b></div>${banner()}<div class="c"><small>${esc(o.cat)} · ${esc(o.size)} · ${esc(o.kg||'?')} kg${o.fr?' · fragile':''}<br>${esc(o.from)} → ${esc(o.to)}<br>Sender ${esc(o.sh)} · Courier ${esc(o.cr||'unassigned')}<br>Fee offered: ${esc(o.fee||0)} + platform fee 0 = ${esc(o.fee||0)} (no payment integrated)${part&&o.note?`<br>Notes: ${esc(o.note)}`:''}</small></div><div class="c"><b>Status${o.dp?' · DISPUTED':''}</b>${o.s<0?'<div class="tag w">CANCELLED</div>':''}<ol>${tl}</ol><small>Live location: unavailable. Last verified update: ${T(o.ev[o.ev.length-1].ts)}.</small></div>${ac}`+
 (mine?`<div class="c" id="cc"><small>Handover codes (valid until ${T(o.exp)}): loading…</small></div>`:'')+
 (part&&o.s>=0&&o.s<6?`<div class="row">${mine&&o.s<=2?'<button class="b r" data-a="cx">Cancel order</button>':''}</div>`:'')+(part&&!o.dp&&o.s>=0?`<h2>Report a problem</h2><input id="dr" maxlength="200" placeholder="What went wrong?" aria-label="Dispute reason"><button class="b r" data-a="dsp">Open dispute</button>`:'');
 if(mine)code(o)}
async function code(o){try{const d=uid&&await db.collection('data/users/'+uid).doc('code_'+o.id).get(),c=d&&d.exists&&d.data(),el=$('#cc');if(el)el.innerHTML=c?`<small>Handover codes (valid until ${T(o.exp)})</small><br>Pickup (give to courier): <b>${c.p}</b><br>Delivery (give to recipient): <b>${c.d}</b>`:'<small>Codes aren’t available on this device.</small>'}catch{}}
function act2(v){const e=evs().filter(x=>S.filt==='all'||x.ts>seen);v.innerHTML=`<h1><span></span>ACTIVITY</h1>${banner()}<div class="row"><button class="b ${S.filt==='all'?'':'g'}" data-a="fl" data-k="all">All</button><button class="b ${S.filt==='un'?'':'g'}" data-a="fl" data-k="un">Unread (${unread()})</button><span class="f"></span><button class="b g" data-a="seen">Mark read</button></div><h2>Delivery updates</h2>`+(S.orders===null&&db?'<div class="sk"></div>':!e.length?'<div class="c mu">No updates. Chat unread markers appear on the room list; push notifications aren’t configured.</div>':e.map(x=>`<button class="c" data-a="od2" data-id="${esc(x.o.id)}">${x.ts>seen?'<span class="dot"></span>':''}<b>${esc(x.o.name)}</b> → ${ST[x.s]||'CANCELLED'}<br><small>${T(x.ts)} · by ${esc(x.by)}</small></button>`).join(''))}
function prof(v){v.innerHTML=`<h1><span></span>PROFILE</h1>${banner()}<div class="c"><div class="row">${av(me.h)}<div class="f"><b>${esc(me.n||me.h)}</b><br><small>${me.h} · <span class="tag">GUEST</span></small></div></div><input id="pn" maxlength="24" value="${esc(me.n)}" placeholder="Custom display name (optional)" aria-label="Display name"><div class="row">${GL.map(g=>`<button class="b g" data-a="gl" data-g="${g}" aria-label="Avatar ${g}">${g}</button>`).join('')}</div><br><button class="b" data-a="sn">Save</button></div>
<div class="c"><b>Session</b><br><small>Guest session stored in this browser only. It can’t be recovered if browser storage is cleared. Your real name, email and phone are never collected. This is pseudonymous, not absolutely anonymous: the hosting platform and the page owner may be able to link activity to your viewing account. Messages are <b>not</b> end-to-end encrypted.</small><br><br><button class="b r" data-a="reset">Reset identity</button></div>
<div class="c"><b>Theme</b><div class="row">${['auto','dark','light'].map(k=>`<button class="b ${th===k?'':'g'}" data-a="th" data-k="${k}">${k}</button>`).join('')}</div></div>
<div class="c"><b>Blocked (${blk.length})</b>${blk.map(h=>`<div class="row"><span class="f">${esc(h)}</span><button class="b g" data-a="unb" data-h="${esc(h)}">Unblock</button></div>`).join('')||'<br><small>No one blocked.</small>'}</div>
<div class="c"><small><b>Not included in this build:</b> maps, GPS, camera evidence, QR codes, push, file uploads, E2EE, server-side authorization, account deletion, Bangla.</small></div>`}
const act={tab(d){S.tab=d.k;S.room=null;S.oid=null;S.form=null;uMsg&&uMsg();uMsg=null;render()},
 nr(){S.form='room';render()},nr0(){S.form=null;render()},
 async mkroom(){const n=$('#rn').value.trim();if(!n)return toast('Name required');try{await db.collection('rooms').add({name:n,desc:$('#rd').value.trim(),by:me.h,ts:Date.now(),last:0});S.form=null}catch(e){toast('Couldn’t create: '+(e.message||e.code))}render()},
 open(d){S.room=S.rooms.find(r=>r.id===d.id);S.msgs=null;S.reply=null;S.sel=null;rd[d.id]=Date.now();L('nx_rd',rd);render();uMsg=db.collection('rooms/'+d.id+'/msgs').orderBy('ts','desc').limit(80).onSnapshot(s=>{S.msgs=s.docs.map(x=>({id:x.id,...x.data()})).reverse();draw()},e=>toast('Connection lost: '+e.code))},
 back(){uMsg&&uMsg();uMsg=null;S.room=null;render()},
 async send(){const i=$('#in'),t=i.value.trim();if(!t||!wr||Date.now()-S.last<1500)return;if(S.off)return toast('You’re offline');S.last=Date.now();const m={by:me.h,n:me.n,uid:ID,text:t,ts:Date.now()};if(S.reply)m.re={by:S.reply.by,text:S.reply.text.slice(0,80)};i.value='';const re=S.reply;S.reply=null;
  try{await db.collection('rooms/'+S.room.id+'/msgs').add(m);await db.doc('rooms/'+S.room.id).update({last:m.ts,lastBy:me.h})}catch(e){i.value=t;S.reply=re;toast('Not sent ('+(e.code||'error')+'). Tap Send to retry.')}},
 sel(d,el){if(e0.target.closest('button,a'))return;S.sel=S.sel===d.id?null:d.id;draw()},
 reply(d){S.reply=S.msgs.find(m=>m.id===d.id);S.sel=null;draw();$('#in').focus()},xr(){S.reply=null;draw()},
 async del(d){try{await db.doc('rooms/'+S.room.id+'/msgs/'+d.id).delete();S.sel=null}catch(e){toast('Delete failed: '+e.code)}},
 block(d){blk.push(d.h);L('nx_blk',blk);S.sel=null;draw();toast('Blocked '+d.h+' (this device only)')},
 unb(d){blk=blk.filter(h=>h!==d.h);L('nx_blk',blk);render()},
 dt(d){S.dt=d.k;render()},no(){S.form='o';render()},nb(){S.form=null;render()},ob(){S.oid=null;render()},od(d){S.oid=d.id;render()},od2(d){S.tab='delivery';S.oid=d.id;render()},
 async mko(){const g=i=>$('#f'+i),n=g(1).value.trim();if(!n||!g(5).value.trim()||!g(6).value.trim())return toast('Name, pickup and drop-off areas are required');
  try{const r=db.collection('orders').doc(),id=r.id,p=rnd(),dc=rnd(),ts=Date.now();
