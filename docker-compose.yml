# Local production-like deployment: PostgreSQL 16 + the NEXORA backend.
# The backend runs migrations on... no — migrations are run explicitly
# (npm run migrate) so a bad migration can never auto-apply on boot.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: nexora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nexora:changeme@db:5432/nexora
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "true"
      CODE_ENCRYPTION_KEY: ${CODE_ENCRYPTION_KEY:?set CODE_ENCRYPTION_KEY in .env}
    ports:
      - "3000:3000"
    volumes:
      - ./storage:/app/storage
volumes:
  pgdata:
